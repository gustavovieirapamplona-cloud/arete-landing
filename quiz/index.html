<style>
:root{
  --bg:#0E0E0E;
  --fg:#FAFAF7;
  --sol:#FFB627;
  --muted:#9A9A94;
  --line:rgba(250,250,247,.15);
  --card:rgba(250,250,247,.04);
  --cardOn:rgba(255,182,39,.10);
  --sombra:rgba(0,0,0,.4);
}
/* Sem variante clara de proposito: a landing e escura sempre, e o mesmo
   anuncio nao pode levar a duas marcas diferentes. */

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;          /* iOS antigo nao conhece dvh */
  min-height:100dvh;
  overscroll-behavior-y:none;               /* sem bounce mostrando o vazio */
  -webkit-tap-highlight-color:transparent;  /* o realce cinza do iOS some */
}

/* Toque: sem atraso de 300ms, sem zoom no toque duplo, sem selecionar o
   texto ao segurar o botao. */
button, a.acao, a.plano{
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
.acao:active{transform:scale(.99)}

/* ---------- estrutura ---------- */
.app{
  min-height:100dvh;
  display:flex;flex-direction:column;
  max-width:460px;margin:0 auto;
  padding:env(safe-area-inset-top) 20px calc(22px + env(safe-area-inset-bottom));
}
body.com-aviso .app{padding-bottom:calc(132px + env(safe-area-inset-bottom))}
@media(min-width:560px){ body.com-aviso .app{padding-bottom:calc(96px + env(safe-area-inset-bottom))} }

.topo{padding:13px 0 0;display:flex;align-items:center;gap:14px;min-height:50px}
.voltar{
  background:none;border:0;cursor:pointer;padding:8px;margin-left:-8px;
  min-height:44px;display:inline-flex;align-items:center;   /* alvo de toque */
  color:var(--muted);font:inherit;font-size:.9rem;line-height:1;
  border-radius:6px;flex:none;
}
.voltar[hidden]{display:none}
/* A marca ocupa o lugar do "voltar" na primeira tela, pra quem chegou do
   anuncio saber onde caiu. */
.marca-topo{
  font-family:'Playfair Display',Georgia,serif;font-weight:700;
  font-size:1.08rem;color:var(--sol);flex:none;
}
.marca-topo[hidden]{display:none}
.barra{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--sol);border-radius:2px;transition:width .3s cubic-bezier(.2,.7,.2,1)}
.barra[hidden]{display:none}

.tela{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:12px 0;animation:entra .17s ease;
}
@keyframes entra{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* Itens entram em cascata: cada um 35ms depois do anterior, 220ms cada. */
@keyframes sobe{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
:is(.opcoes,.chips,.chats,.blocos,.planos)>*{animation:sobe .22s cubic-bezier(.2,.7,.2,1) both}
:is(.opcoes,.chips,.chats,.blocos,.planos)>:nth-child(2){animation-delay:.035s}
:is(.opcoes,.chips,.chats,.blocos,.planos)>:nth-child(3){animation-delay:.07s}
:is(.opcoes,.chips,.chats,.blocos,.planos)>:nth-child(4){animation-delay:.105s}
:is(.opcoes,.chips,.chats,.blocos,.planos)>:nth-child(5){animation-delay:.14s}
:is(.opcoes,.chips,.chats,.blocos,.planos)>:nth-child(6){animation-delay:.175s}
:is(.opcoes,.chips,.chats,.blocos,.planos)>:nth-child(n+7){animation-delay:.21s}
.acoes{animation:sobe .22s cubic-bezier(.2,.7,.2,1) .12s both}
.marca-topo{animation:entra .3s ease both}

/* ---------- texto ---------- */
.marca{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:2.9rem;line-height:1.05;margin-bottom:12px}
.sub{font-size:1.12rem;margin-bottom:10px}
.apoio{font-size:.97rem;color:var(--muted);margin-bottom:28px;max-width:30em}
.pergunta{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.58rem;line-height:1.22;margin-bottom:22px}
.entrada{font-size:.93rem;color:var(--muted);margin-bottom:5px}
.dica{font-size:.92rem;color:var(--muted);margin:-10px 0 20px;max-width:30em}
.titulo{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.42rem;line-height:1.2;margin-bottom:14px}

/* ---------- respostas ---------- */
.opcoes{display:flex;flex-direction:column;gap:10px}
.opcao{
  font:inherit;text-align:left;cursor:pointer;
  min-height:56px;padding:15px 18px;
  background:var(--card);color:var(--fg);
  border:1px solid var(--line);border-radius:10px;
  transition:border-color .15s ease,background .15s ease;
}
.opcao:active{background:var(--cardOn);transform:scale(.985)}
.opcao.escolhida{border-color:var(--sol);background:var(--cardOn)}
.opcao{transition:border-color .15s ease,background .15s ease,transform .1s ease}
.chip:active{transform:scale(.96)}

.acao{
  font:inherit;font-weight:700;cursor:pointer;
  min-height:56px;padding:16px 28px;width:100%;
  background:var(--sol);color:var(--bg);
  border:0;border-radius:10px;transition:filter .15s ease;
}
a.acao{display:block;text-align:center;text-decoration:none;line-height:24px}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{
  font:inherit;font-size:.92rem;cursor:pointer;
  min-height:48px;padding:11px 16px;
  background:var(--card);color:var(--fg);
  border:1px solid var(--line);border-radius:999px;
  transition:border-color .15s ease,background .15s ease;
}
.chip{transition:border-color .15s ease,background .15s ease,transform .1s ease}
.chip[aria-pressed="true"]{border-color:var(--sol);background:var(--cardOn);font-weight:600}
.outros-campo{
  font:inherit;width:100%;min-height:52px;padding:14px 16px;margin-bottom:16px;
  background:var(--card);color:var(--fg);
  border:1px solid var(--line);border-radius:10px;
}
.outros-campo::placeholder{color:var(--muted)}

/* ---------- blocos de explicacao ---------- */
.chats{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.chat{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;font-size:.92rem;line-height:1.38;color:var(--muted);
}
.chat b{display:block;color:var(--fg);font-weight:700;font-size:.99rem;margin-bottom:3px}

.blocos{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.bloco{position:relative;padding-left:16px;font-size:.9rem;line-height:1.38;color:var(--muted)}
.bloco::before{content:"";position:absolute;left:0;top:.56em;width:6px;height:6px;border-radius:50%;background:var(--sol)}
.bloco a{color:var(--fg)}

/* ---------- duvidas ---------- */
.duvida{border-bottom:1px solid var(--line)}
.duvida:first-of-type{border-top:1px solid var(--line)}
.duvida summary{
  cursor:pointer;list-style:none;font-weight:600;font-size:.97rem;
  min-height:50px;padding:14px 0;
  display:flex;justify-content:space-between;gap:14px;align-items:center;
}
.duvida summary::-webkit-details-marker{display:none}
.duvida summary::after{content:"+";color:var(--sol);font-weight:700;font-size:1.25rem;flex:none}
.duvida[open] summary::after{content:"\2013"}
.duvida p{padding:0 0 14px;font-size:.93rem;line-height:1.5;color:var(--muted)}
.duvida p a{color:var(--fg)}

/* ---------- precos ---------- */
.planos{display:flex;flex-direction:column;gap:11px;margin-bottom:14px}
.plano{
  display:block;position:relative;text-decoration:none;color:var(--fg);cursor:pointer;
  padding:18px 44px 18px 18px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  transition:border-color .15s ease,background .15s ease,transform .1s ease;
}
/* A seta diz que o cartao e tocavel; os dois tem a mesma, nenhum e destacado. */
.plano::after{content:"\203A";position:absolute;right:18px;top:14px;color:var(--sol);font-size:1.6rem;line-height:1}
.plano:active{background:var(--cardOn);border-color:var(--sol);transform:scale(.985)}
.plano .nome{font-size:.73rem;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.plano .valor{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.85rem;line-height:1}
.plano .extra{margin-top:9px;font-size:.88rem;color:var(--muted);line-height:1.4}
.parcela{font-size:.9rem;color:var(--muted);margin-bottom:18px}

/* ---------- rodapes discretos ---------- */
/* Em telas que nao cabem (explicacao em celular pequeno), o texto rola mas a
   acao fica colada no rodape: o botao de resposta nunca sai do alcance.
   Em tela que cabe, sticky nao faz nada — o elemento nem chega a sair. */
.acoes{
  position:sticky;bottom:0;
  padding:10px 0 calc(4px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 78%, transparent);
}
.rodape{margin-top:14px;text-align:center}
.linksec{
  background:none;border:0;cursor:pointer;padding:12px;
  font:inherit;font-size:.9rem;color:var(--muted);
  text-decoration:underline;text-underline-offset:3px;
}
.nota{margin-top:16px;font-size:.88rem;color:var(--muted);text-align:center}

/* ---------- aviso de cookies ---------- */
.aviso{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--bg);border-top:1px solid var(--line);
  box-shadow:0 -8px 24px var(--sombra);
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;
}
.aviso[hidden]{display:none}
.aviso p{font-size:.85rem;color:var(--muted);margin:0;max-width:40em;text-align:center}
.aviso a{color:var(--fg)}
.aviso-btns{display:flex;gap:9px}
.abtn{
  font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;
  min-height:44px;padding:11px 22px;border-radius:8px;
  background:var(--sol);color:var(--bg);border:1px solid var(--sol);
}
.abtn.fantasma{background:transparent;color:var(--muted);border-color:var(--line)}

/* Hover so onde existe ponteiro: no toque ele gruda e o item parece escolhido. */
@media (hover: hover){
  .opcao:hover,.chip:hover,.plano:hover{border-color:var(--sol)}
  .acao:hover{filter:brightness(1.08)}
  .voltar:hover,.linksec:hover,.abtn.fantasma:hover{color:var(--fg)}
}

:focus-visible{outline:3px solid var(--sol);outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

.semjs{padding:40px 20px;max-width:460px;margin:0 auto;text-align:center}
.semjs a{color:var(--sol)}
</style>
</head>

<script>
(function(){
'use strict';

   ============================================================ */

// Pixel da landing (business pamplonaperformance). Preenchido em vez de

var META_PIXEL_ID = '1383933286459138';

var CHAVE_UTM    = 'arete-utm';

   Pixel — so carrega depois do consentimento (LGPD art. 7 I)
   ============================================================ */

function carregarPixel(){
  if (window.fbq) return;
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
  (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', META_PIXEL_ID);
  fbq('track', 'PageView');
}
function evento(nome, params){ if (window.fbq) fbq('track', nome, params || undefined); }
function eventoCustom(nome){ if (window.fbq) fbq('trackCustom', nome); }

function lerCookie(){ try { return localStorage.getItem(CHAVE_COOKIE); } catch(e){ return null; } }
function gravarCookie(v){ try { localStorage.setItem(CHAVE_COOKIE, v); } catch(e){} }

/* utm_* e fbclid: guardados, nunca enviados na mensagem */
(function guardarOrigem(){
  try {
    var q = new URLSearchParams(location.search), achou = {}, tem = false;
    q.forEach(function(valor, chave){
      if (chave.indexOf('utm_') === 0 || chave === 'fbclid') { achou[chave] = valor; tem = true; }
    });

/* ============================================================
   Estado
   ============================================================ */

var estado = { perfil: null, temas: [], temasOutros: '' };
var pilha = [];
var atual = null;

var PERFIS = {
  AMBOS:  'Faço ambos',
  TREINO: 'Só treino',
  ESTUDO: 'Só estudo',
  VOLTAR: 'Estudo e quero voltar a treinar',
  NADA:   'Nenhum dos dois ainda'
};

/* ============================================================
   Render
   ============================================================ */

var app     = document.getElementById('app');
var tela    = document.getElementById('tela');
var barra   = document.getElementById('barra');
var fill    = document.getElementById('barraFill');
var btVolta = document.getElementById('voltar');
var marcaTopo = document.getElementById('marcaTopo');

function ir(id, semHistorico){
  if (atual && !semHistorico) pilha.push({ id: atual, estado: JSON.parse(JSON.stringify(estado)) });
  atual = id;
  TELAS[id]();
  atualizarTopo();
  window.scrollTo(0, 0);
}

// Voltar e marca dividem o mesmo canto: um aparece quando o outro some.
function atualizarTopo(){
  var inicio = pilha.length === 0;
  btVolta.hidden = inicio;
  marcaTopo.hidden = !inicio;
}

btVolta.addEventListener('click', function(){
  var anterior = pilha.pop();
  if (!anterior) return;
  estado = anterior.estado;
  atual = anterior.id;
  TELAS[atual]();
  atualizarTopo();
  window.scrollTo(0, 0);
});

function progresso(passo){
  if (!passo) { barra.hidden = true; return; }
  barra.hidden = false;
  fill.style.width = Math.round(passo / TOTAL_PERGUNTAS * 100) + '%';
}

// Pausa com a resposta acesa antes de trocar de tela. Zero pra quem pediu
// movimento reduzido.
var PAUSA = (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 0 : 150;
var travado = false;

var caixaAcoes = null;
function limpar(){
  while (tela.firstChild) tela.removeChild(tela.firstChild);
  caixaAcoes = null;
}
// Botao principal e link secundario moram na mesma caixa grudada no rodape.
function areaAcoes(){
  if (!caixaAcoes) { caixaAcoes = el('div', 'acoes'); tela.appendChild(caixaAcoes); }
  return caixaAcoes;
}

function el(tag, classe, texto){
  var n = document.createElement(tag);
  if (classe) n.className = classe;
  if (texto != null) n.textContent = texto;
  return n;
}

function link(url, texto){
  var a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  a.textContent = texto;
  return a;
}

function opcoes(lista){
  var caixa = el('div', 'opcoes');
  lista.forEach(function(item){
    var b = el('button', 'opcao', item.texto);
    b.type = 'button';
    b.setAttribute('aria-label', item.texto);
    b.addEventListener('click', function(){
      if (travado) return;                       // segundo toque durante a pausa
      if (!PAUSA) { item.acao(); return; }       // movimento reduzido: direto
      travado = true;
      b.classList.add('escolhida');              // a resposta acende...
      setTimeout(function(){ travado = false; item.acao(); }, PAUSA);   // ...e so entao troca
    });
    caixa.appendChild(b);
  });
  tela.appendChild(caixa);
}

function botaoAcao(texto, aoTocar){
  var b = el('button', 'acao', texto);
  b.type = 'button';
  b.addEventListener('click', aoTocar);
  areaAcoes().appendChild(b);
}

function linkDiscreto(texto, aoTocar){
  var r = el('div', 'rodape');
  var b = el('button', 'linksec', texto);
  b.type = 'button';
  b.addEventListener('click', aoTocar);
  r.appendChild(b);
  areaAcoes().appendChild(r);
}

/* ============================================================
   Mensagem do WhatsApp
   ============================================================ */

var PRIMEIRA_PESSOA = {};
PRIMEIRA_PESSOA[PERFIS.AMBOS]  = 'Faço ambos';
PRIMEIRA_PESSOA[PERFIS.TREINO] = 'Só treino';
PRIMEIRA_PESSOA[PERFIS.ESTUDO] = 'Só estudo';
PRIMEIRA_PESSOA[PERFIS.VOLTAR] = 'Estudo e quero voltar a treinar';
PRIMEIRA_PESSOA[PERFIS.NADA]   = 'Não faço nenhum dos dois ainda';

function fraseTemas(){
  var nomes = estado.temas
    .filter(function(t){ return t !== 'Outros'; })
    .map(function(t){ return t.toLowerCase(); });

  var livre = estado.temasOutros.trim();
  if (livre) nomes.push(livre.toLowerCase());
  if (!nomes.length) return '';

  var lista = nomes.length === 1
    ? nomes[0]
    : nomes.slice(0, -1).join(', ') + ' e ' + nomes[nomes.length - 1];

  return 'Estudo ' + lista + '.';
}

function mensagem(plano){
  // Primeira linha fixa, palavra por palavra: e por ela que o CRM
  // reconhece quem veio do quiz.
  var linhas = ['Olá! Fiz o quiz do site.'];
  if (estado.perfil) linhas.push(PRIMEIRA_PESSOA[estado.perfil]);
  var t = fraseTemas();
  if (t) linhas.push(t);
  linhas.push(plano ? 'Escolhi o plano ' + plano + '.' : 'Fiquei com uma dúvida.');
  return linhas.join('\n');
}

function linkWhatsApp(plano){
  return 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(mensagem(plano));
}

/* ============================================================
   Telas
   ============================================================ */

var TELAS = {};

/* ---- 1. qualificacao — o quiz abre direto aqui ---- */
var jaEngajou = false;

TELAS.perfil = function(){
  limpar(); progresso(1);
  tela.appendChild(el('h2', 'pergunta', 'Você treina? Estuda?'));
  tela.appendChild(el('p', 'dica', 'Responde 4 perguntas rápidas e veja se faz sentido pra você.'));

  var ordem = [PERFIS.AMBOS, PERFIS.TREINO, PERFIS.ESTUDO, PERFIS.VOLTAR, PERFIS.NADA];
  opcoes(ordem.map(function(p){
    return { texto: p, acao: function(){
      // Sem tela de abertura, "engajou" passa a ser a primeira resposta.
      if (!jaEngajou) { jaEngajou = true; evento('ViewContent'); }
      estado.perfil = p;
      estado.temas = [];
      estado.temasOutros = '';
      // Quem nao estuda nao tem tema pra listar: vai pra pergunta de interesse.
      var semEstudo = p === PERFIS.TREINO || p === PERFIS.NADA;
      ir(semEstudo ? 'interesse' : 'temas');
    }};
  }));
};

/* ---- 3. os temas ---- */
var TEMAS = [
  'Filosofia', 'Estoicismo', 'Teologia', 'Línguas', 'História', 'Política',
  'Lógica e retórica', 'Literatura', 'Concurso público', 'Psicologia', 'Outros'
];

TELAS.temas = function(){
  limpar(); progresso(2);
  tela.appendChild(el('h2', 'pergunta', 'Estuda quais temas?'));

  var caixa = el('div', 'chips');
  var campo = el('input', 'outros-campo');
  campo.type = 'text';
  campo.placeholder = 'Quais? (opcional)';
  campo.setAttribute('aria-label', 'Outros temas que você estuda');
  campo.value = estado.temasOutros;

  TEMAS.forEach(function(nome){
    var c = el('button', 'chip', nome);
    c.type = 'button';
    c.setAttribute('aria-pressed', estado.temas.indexOf(nome) >= 0 ? 'true' : 'false');
    c.addEventListener('click', function(){
      var i = estado.temas.indexOf(nome);
      if (i >= 0) estado.temas.splice(i, 1); else estado.temas.push(nome);
      c.setAttribute('aria-pressed', i >= 0 ? 'false' : 'true');
      if (nome === 'Outros') {
        campo.hidden = estado.temas.indexOf('Outros') < 0;
        if (campo.hidden) { campo.value = ''; estado.temasOutros = ''; } else campo.focus();
      }
    });
    caixa.appendChild(c);
  });

  campo.hidden = estado.temas.indexOf('Outros') < 0;
  campo.addEventListener('input', function(){ estado.temasOutros = campo.value; });

  tela.appendChild(caixa);
  tela.appendChild(campo);
  botaoAcao('Continuar', function(){ ir('concordancia'); });
};

var aviso = document.getElementById('aviso');
var escolha = lerCookie();
if (escolha === 'sim') carregarPixel();

if (!escolha) {
  aviso.hidden = false;
  document.body.classList.add('com-aviso');
}

aviso.addEventListener('click', function(e){
  var resposta = e.target.getAttribute && e.target.getAttribute('data-cookie');
  if (!resposta) return;
  gravarCookie(resposta);
  aviso.hidden = true;
  document.body.classList.remove('com-aviso');
  if (resposta === 'sim') carregarPixel();
});
